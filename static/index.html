<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Танковый чат</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>Танковый чат</h1>
    <span id="room-status">Подключение…</span>
  </header>
  <main>
    <section class="arena">
      <canvas id="board" aria-label="Игровое поле"></canvas>
      <p id="hint">Команды отправляются из терминального клиента.</p>
    </section>
    <section class="participants" aria-label="Участники">
      <h2>Убийства</h2>
      <ol id="kills-list"></ol>
    </section>
  </main>
  <script src="/static/game.js"></script>
</body>
</html>
